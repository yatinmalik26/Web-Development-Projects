<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
</head>
<body>
    <header>
        <a href="http://127.0.0.1:5500/Diff%20pages/index.html"
        ><img src="../gallary/new_cn_logo.svg"
      /></a>

    </header>
    <h1>Create an account</h1>
    <form>
        <fieldset>
            <legend>Login information</legend>
            <label for="name">Fullname:</label>
            <input type="text" name="name" id="name" required/>
            <br/>
            <br/>
            <label for="Email">Email:</label>
            <input type="Email" name="Email" id="Email" required/>
            <br/>
            <br/>
            <label for="username">Username:</label>
            <input type="text" name="username" id="username" required/>
            <br/>
            <br/>
            <label for="password">Password:</label>
            <input type="password" name="password" id="password" required/>
            <br/>
            <br/><label for="user type">User type</label>
            <select name="user type" id="user type" required>
                <option value="select user type" disabled selected >select user type</option>
                <option value="instructor">Instructor</option>
                <option value="student">Student</option>
           
            </select>
            <br/>
            <br/>
            <label for="course">Select course:</label>
            <select name="course" id="course" required>
                <option value="Course 1 - Web Development" selected >Course 1 - Web Development</option>
                <option value="Course 2 - Data science fundamentals">Course 2 - Data science fundamentals</option>
                <option value="Course 3 - Digital marketing mastery" selected >Course 3 - Digital marketing mastery</option>
                <option value="Course 4 - Android Development">Course 4 - Android Development</option>
           
            </select>
            <br/>
            <br/>
            
            <button type="submit" value="Register">Register</button>



        </fieldset>
    </form>
    
</body>
</html>
