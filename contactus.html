<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
  </head>
  <body>
    <header>
      <a href="http://127.0.0.1:5500/Diff%20pages/index.html"
        ><img src="new_cn_logo.svg"
      /></a>

      <hr />
    </header>
    <main>
        <section id="Contact info">
      <h2>Contact Details</h2>
      <p>You can reach us via email or phone:</p>

      <nav>
        <label>Email:</label>
        <a href="mailto:contact@codingninjas.com"
          >contact@codingninjas.com</a
        >

        <br />
        <br />

        <label>Phone:</label>
        <a href="tel:1800-123-3598"
          >1800-123-3598</a
        >
      </nav>
    </section>
      <hr />
      <section id="loc">
      <h2>Locations</h2>
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d112262.05138071995!2d76.9736014390625!3d28.44371529999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390d1900297b6ad3%3A0xd587b3712b897066!2sCoding%20Ninjas!5e0!3m2!1sen!2sin!4v1787500896929!5m2!1sen!2sin"
        width="600"
        height="450"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </section>
    </main>
    <form action="#" method="post">
        <fieldset>
            <legend><b>Feedback Form</b></legend>
    <label>Name:</label>
    <input type="text" id="name" name="name" required/>
    <br/>
    <br/>
    <label> Email:</label>
    <input type="Email" id="Email" name="Email" required/>
    <br/>
    <br/>
    <label>Subject:</label>
    <input type="text" id="sub" name="subject" required/>
    <br/>
    <br/>
    <label>Message:</label>
    <textarea type="text" id="message" name="message" cols="25" rows="5" required/></textarea>
    <br/>
    <br/>
    <button type="submit" value="submit">Submit</button>
</fieldset>




    </form>
  </body>
</html>
